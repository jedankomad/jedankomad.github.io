name: Sync Letterboxd

on:
  schedule:
    - cron: '0 */6 * * *'   # na svakih 6 sati
  workflow_dispatch:         # ručno pokretanje (Actions tab -> Run workflow)

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Letterboxd RSS
        run: python scripts/letterboxd_sync.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add _data/movies.json
          git diff --cached --quiet && echo "Nema promena" && exit 0
          git commit -m "Sync Letterboxd"
          git push
